name: Build

on:
  workflow_dispatch:

jobs:
  build:
    name: APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build arm64 release APK
        run: |
          flutter build apk --release --target-platform android-arm64
          find build/app/outputs -name "*.apk" -type f -print

      - name: Collect artifact
        run: |
          mkdir -p dist
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/aurora-arm64-v8a-release.apk
          elif [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/aurora-arm64-v8a-release.apk
          else
            apk=$(find build/app/outputs -name "*.apk" -type f | head -n1)
            if [ -z "$apk" ]; then
              echo "No APK found" >&2
              exit 1
            fi
            cp "$apk" dist/aurora-arm64-v8a-release.apk
          fi
          ls -lh dist/
          file dist/aurora-arm64-v8a-release.apk || true


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci
          files: dist/aurora-arm64-v8a-release.apk
